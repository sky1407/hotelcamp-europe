<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>HotelCamp Europe</title>
    <!--
      GitHub Pages has no server-side routing, so a direct link or refresh on a
      client-side route (e.g. /hotels/37) returns this 404 page. This script
      re-encodes the path into a query string and redirects to the app's real
      entry point, where the inline script in index.html decodes it back and
      restores the URL via history.replaceState before React Router mounts.
      Technique: https://github.com/rafgraph/spa-github-pages
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 1; // keep "/hotelcamp-europe"
      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
        l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
